services:
  llm-request-code:
    build:
      context: ./llm-request-code
      dockerfile: Dockerfile
    volumes:
      - ./data:/data
      - ./games:/games
      - ./prompts:/prompts
    networks:
      - llm-request-code-net
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_URL=http://ollama:11434
      - COMMAND=run

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - llm-request-code-net
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

networks:
  llm-request-code-net:
